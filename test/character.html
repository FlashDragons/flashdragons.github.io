<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A character test</title>
    <link rel="icon" type="x-icon" href="../assets/icon.ico">
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/font-face.css">
</head>
<body>
    <div class="container">
        <p>Here is an <a href="./ai/meta_name_viewport.html" target="_blank">introduction</a> of <code>&lt;meta name="viewport"&gt;</code>.</p>
        <p>字符转义：（删掉“_”）</p>
        <ul>
            <li>'&': '&_amp;'</li>
            <li>'<': '&_lt;'</li>
            <li>'>': '&_gt;'</li>
            <li>'"': '&_quot;'</li>
            <li>"'": '&_#39;'</li>
            <li>'普通空格': '&_nbsp;'或'&_#160;'</li>
            <li>'半角空格': '&_ensp;'</li>
            <li>'全角空格': '&_emsp;'</li>
            <li>'细空格': '&_thinsp;'</li>
        </ul>
    </div>
    <script src="../js/bootstrap.bundle.min.js"></script>
</body>
</html>
