<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A clock test</title>
    <link rel="icon" type="x-icon" href="https://flashdragons.github.io/assets/icon.ico">
    <link rel="stylesheet" href="https://flashdragons.github.io/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://flashdragons.github.io/css/font-face.css">
    <link rel="stylesheet" href="Time_Check_Image.css">
    <style>
        #clock {
            font-family: 'Arial', sans-serif;
            font-size: 48px;
            color: #333;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            display: inline-block;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .clock-container {
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
    <a href="clock.html" target="_blank">实时时钟显示</a>
    <h1>时钟测试</h1>
    <div class="clock-container">
        <h2>实时时钟</h2>
        <div id="clock">--:--:--</div>
    </div>
    <script>
        function updateClock() {
            const now = new Date();
            
            // 获取时分秒
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            
            // 格式化为两位数
            hours = hours.toString().padStart(2, '0');
            minutes = minutes.toString().padStart(2, '0');
            seconds = seconds.toString().padStart(2, '0');
            
            // 显示时间
            document.getElementById('clock').textContent = 
                `${hours}:${minutes}:${seconds}`;
        }
        
        // 立即更新一次
        updateClock();
        
        // 每秒更新一次
        setInterval(updateClock, 1000);
    </script>
    <h1>🌅 智能时间图片展示</h1>
    <a href="Time_Check_Image.html" target="_blank">在不同的时间在同一个页面显示不同的图片</a>
    <img id="dynamicImage" class="time-image" src="Time_Check_Image.js" alt="动态图片">
    <div class="info-panel">
        <div class="time-card">
            <div class="time-value" id="currentTime">--:--</div>
            <div class="time-label">当前时间</div>
        </div>
        <div class="time-card">
            <div class="time-value" id="timePeriod">--</div>
            <div class="time-label">时段</div>
        </div>
        <div class="time-card">
            <div class="time-value" id="currentSeason">--</div>
            <div class="time-label">季节</div>
        </div>
        <div class="time-card">
            <div class="time-value" id="currentWeekday">--</div>
            <div class="time-label">星期</div>
        </div>
        <p id="imageDescription">正在加载时间信息...</p>
    </div>
    </div>
    <script src="https://flashdragons.github.io/js/bootstrap.bundle.min.js"></script>
    <script src="https://flashdragons.github.io/js/clock.js"></script>
    <script src="Time_Check_Image.js"></script>
</body>
</html>
