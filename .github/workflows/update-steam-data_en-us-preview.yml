name: Update Steam card

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-steam-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update Steam data
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: node js/update-steam-data_en-us.mjs

      - name: Commit changed data
        run: |
          if git diff --quiet -- index_en-us-preview.html; then
            echo "Steam data did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_en-us-preview.html
          git commit -m "chore: update Steam card data"
          git push
