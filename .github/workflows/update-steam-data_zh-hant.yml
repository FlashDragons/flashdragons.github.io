name: Update Steam card zh-hant

on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-steam-card-zh-hant
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update Steam data zh-hant
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: node js/update-steam-data_zh-hant.mjs

      - name: Commit changed data
        run: |
          if git diff --quiet -- index_zh-hant.html; then
            echo "Steam data did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_zh-hant.html
          git commit -m "chore: update Steam card data zh-hant"
          git push
