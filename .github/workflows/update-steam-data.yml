name: Update Steam cards

on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-steam-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update all Steam card data
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          node test/ai/scripts/update-steam-data.mjs
          node js/update-steam-data_en-us.mjs
          node js/update-steam-data_zh-hans.mjs
          node js/update-steam-data_zh-hant.mjs

      - name: Commit changed data
        run: |
          if git diff --quiet -- \
            test/ai/steam_data_en-us.html \
            iframe/steam-data_en-us.html \
            iframe/steam-data_zh-hans.html \
            iframe/steam-data_zh-hant.html; then
            echo "Steam data did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            test/ai/steam_data_en-us.html \
            iframe/steam-data_en-us.html \
            iframe/steam-data_zh-hans.html \
            iframe/steam-data_zh-hant.html
          git commit -m "chore: update Steam card data for all pages"
          git push
